<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Monedero Compartido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
        <div class="text-center">
            <i class="fas fa-wallet text-4xl text-indigo-600"></i>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Monedero Compartido</h1>
            <p class="text-gray-500">Inicia sesión o regístrate para continuar</p>
        </div>

        <!-- Mensaje de Éxito (para reset) -->
        <div id="success-message"
            class="hidden p-3 bg-green-100 border border-green-300 text-green-700 text-sm rounded-lg"></div>
        <!-- Mensaje de Error -->
        <div id="error-message" class="hidden p-3 bg-red-100 border border-red-300 text-red-700 text-sm rounded-lg">
        </div>

        <!-- Formulario de Inicio de Sesión -->
        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-email" class="text-sm font-medium text-gray-700">Correo Electrónico</label>
                <input type="email" id="login-email" required
                    class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
                <label for="login-password" class="text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="login-password" required
                    class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div class="text-right text-sm">
                <a href="#" id="forgot-password-link"
                    class="font-medium text-indigo-600 hover:text-indigo-500">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit"
                class="w-full py-3 font-bold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition">
                Iniciar Sesión
            </button>
        </form>

        <!-- Formulario de Registro (inicialmente oculto) -->
        <form id="register-form" class="hidden space-y-4">
            <div>
                <label for="register-email" class="text-sm font-medium text-gray-700">Correo Electrónico</label>
                <input type="email" id="register-email" required
                    class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
                <label for="register-password" class="text-sm font-medium text-gray-700">Contraseña (mín. 6
                    caracteres)</label>
                <input type="password" id="register-password" required
                    class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <button type="submit"
                class="w-full py-3 font-bold text-white bg-green-600 rounded-lg hover:bg-green-700 transition">
                Crear Cuenta
            </button>
        </form>

        <!-- Formulario de Recuperar Contraseña (inicialmente oculto) -->
        <form id="reset-form" class="hidden space-y-4">
            <div>
                <label for="reset-email" class="text-sm font-medium text-gray-700">Correo Electrónico</label>
                <input type="email" id="reset-email" required
                    class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    placeholder="Ingresa tu correo">
            </div>
            <button type="submit"
                class="w-full py-3 font-bold text-white bg-gray-600 rounded-lg hover:bg-gray-700 transition">
                Enviar enlace de recuperación
            </button>
        </form>

        <div class="text-center text-sm">
            <a href="#" id="toggle-form" class="font-medium text-indigo-600 hover:text-indigo-500">¿No tienes una
                cuenta? Regístrate</a>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>

</html>
